# Solo Cloudflare Pages (Git integration): sin `main`, sin `assets`, sin `images`.
# El Worker OpenNext y bindings completos están en `wrangler.worker.jsonc` (+ `--config` en npm scripts).
# Advanced Mode: `_worker.js`; OpenNext escribe `worker.js` → `scripts/cf-pages-prep.mjs`.
# @see https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "tripverse-web"
pages_build_output_dir = ".open-next"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
