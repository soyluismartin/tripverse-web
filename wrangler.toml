# Minimal Pages hint: tells Cloudflare Pages where OpenNext static assets land after
# `npx @opennextjs/cloudflare build`. Full Worker/asset bindings stay in `wrangler.jsonc`.
name = "tripverse-web"
pages_build_output_dir = ".open-next/assets"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
